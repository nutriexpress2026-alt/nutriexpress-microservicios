# API Gateway (HT-02, RNF-ARQ-04): la única puerta de entrada para el navegador.
#
# Reparte por la ruta: /api/<recurso>/... va al microservicio dueño de ese
# recurso. Las rutas son las mismas que usaba el monolito, de modo que el
# frontend reutilizado no necesita saber que detrás hay varios servicios.
#
# También resuelve CORS en un solo lugar: los servicios no lo repiten.

# Docker resuelve los nombres de los servicios. Con el nombre en una variable,
# nginx arranca aunque algún servicio todavía no esté listo.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_origin $origen_permitido {
    default                    "";
    "http://localhost:3000"    $http_origin;
    "http://127.0.0.1:3000"    $http_origin;
}

server {
    listen 80;
    client_max_body_size 5m;

    add_header Access-Control-Allow-Origin      $origen_permitido always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type" always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Un microservicio caído (RNF-DIS-01): en lugar de la página HTML de nginx,
    # un error con el formato de la API que el frontend sabe mostrar. Solo
    # cubre los errores del propio gateway; los que responde un servicio pasan
    # tal cual (sin proxy_intercept_errors).
    error_page 502 504 = @servicio_caido;

    location @servicio_caido {
        default_type application/json;
        return 503 '{"error":"Este servicio no responde en este momento. Intente de nuevo en unos minutos."}';
    }

    location = /api/health {
        default_type application/json;
        return 200 '{"estado":"ok","servicio":"gateway"}';
    }

    # ms-identidad: usuarios, roles, permisos, cargos, sesión y perfil (Sprint 1)
    location ~ ^/api/(auth|usuarios|roles|cargos|perfil)(/|$) {
        set $destino http://ms-identidad:4001;
        proxy_pass $destino;
    }

    # ms-catalogo: productos, catálogo público e información del negocio (Sprint 2)
    location ~ ^/api/(productos|catalogo|negocio)(/|$) {
        set $destino http://ms-catalogo:4002;
        proxy_pass $destino;
    }

    # ms-inventario: almacenes, insumos, notas de ingreso y egreso, stock (Sprint 2)
    location ~ ^/api/(almacenes|insumos|ingresos|egresos|stock)(/|$) {
        set $destino http://ms-inventario:4003;
        proxy_pass $destino;
    }

    # ms-reportes: contador de visitas (Sprint 1); reportes desde el Sprint 6
    location ~ ^/api/visitas(/|$) {
        set $destino http://ms-reportes:4007;
        proxy_pass $destino;
    }

    # Lo que todavía no tiene microservicio responde 503 con el formato de
    # error de la API, para que el frontend lo muestre como un aviso.
    location /api/ {
        default_type application/json;
        return 503 '{"error":"Este módulo todavía no está disponible: se implementa en un próximo sprint."}';
    }
}
