# NutriExpress — microservicios (HT-01, RNF-ARQ-06).
#
#   docker compose up -d --build     levanta todo
#   docker compose logs -f ms-identidad
#
# Puertos hacia la PC (los de adentro de la red de Docker no cambian):
#   8080  API Gateway: la única entrada para el navegador (RNF-ARQ-04)
#   5433  PostgreSQL (5433 para no chocar con un PostgreSQL local en el 5432)
#   27018 MongoDB
#   6380  Redis (6380 para no chocar con un Redis local en el 6379), solo desde esta PC
#   15672 Panel de RabbitMQ (usuario y contraseña en .env)
#   5673  RabbitMQ (AMQP), solo desde esta PC: lo usan las pruebas
#
# Cada microservicio tiene su propia base (RNF-ARQ-02): un mismo servidor de
# PostgreSQL con una base y un usuario por servicio, y MongoDB para ms-reportes.
# Redis es un complemento en memoria (RNF-ARQ-03) de ms-identidad y ms-catalogo,
# con un prefijo de clave por servicio: no guarda nada que no exista también en
# su gestor principal.

name: nutriexpress

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      # Crea una base y un usuario por microservicio la primera vez.
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  mongo:
    # 4.4 y no 7: MongoDB 5.0+ exige un procesador con AVX, y la PC de desarrollo
    # no lo tiene (el contenedor arrancaba y se cerraba solo).
    image: mongo:4.4
    ports:
      - "27018:27017"
    volumes:
      - datos-mongo:/data/db

  redis:
    image: redis:7.4-alpine
    # appendonly: lo que guarda (por ejemplo, tokens revocados) sobrevive a un reinicio.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_CLAVE:-nutriexpress}"]
    environment:
      REDISCLI_AUTH: ${REDIS_CLAVE:-nutriexpress}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - datos-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO:-nutriexpress}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_CLAVE:-nutriexpress}
    ports:
      - "15672:15672"
      # AMQP, para las pruebas que corren en la PC (5673: no chocar con un RabbitMQ local).
      - "127.0.0.1:5673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 12

  ms-identidad:
    build: ./servicios/ms-identidad
    environment:
      DATABASE_URL: postgresql://identidad:${IDENTIDAD_CLAVE_BD:-identidad}@postgres:5432/identidad_db
      PORT: 4001
      CLAVES_DIR: /claves
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-nutriexpress}:${RABBITMQ_CLAVE:-nutriexpress}@rabbitmq:5672
      # Complemento: los contadores de los límites por IP (claves identidad:limite:*).
      REDIS_URL: redis://:${REDIS_CLAVE:-nutriexpress}@redis:6379/0
    volumes:
      # Par de claves con que se firman los tokens (RS256). Se crea solo la
      # primera vez y sobrevive a los reinicios.
      - claves-jwt:/claves
    depends_on:
      postgres:
        condition: service_healthy
      # Solo el orden de arranque: si RabbitMQ o Redis caen, el servicio sigue y se reconecta solo.
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started

  ms-catalogo:
    build: ./servicios/ms-catalogo
    environment:
      DATABASE_URL: postgresql://catalogo:${CATALOGO_CLAVE_BD:-catalogo}@postgres:5432/catalogo_db
      PORT: 4002
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-nutriexpress}:${RABBITMQ_CLAVE:-nutriexpress}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      # Solo el orden de arranque: si RabbitMQ cae, el servicio sigue y se reconecta solo.
      rabbitmq:
        condition: service_started

  ms-inventario:
    build: ./servicios/ms-inventario
    environment:
      DATABASE_URL: postgresql://inventario:${INVENTARIO_CLAVE_BD:-inventario}@postgres:5432/inventario_db
      PORT: 4003
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-nutriexpress}:${RABBITMQ_CLAVE:-nutriexpress}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      # Solo el orden de arranque: si RabbitMQ cae, el servicio sigue y se reconecta solo.
      rabbitmq:
        condition: service_started

  ms-pedidos:
    build: ./servicios/ms-pedidos
    environment:
      DATABASE_URL: postgresql://pedidos:${PEDIDOS_CLAVE_BD:-pedidos}@postgres:5432/pedidos_db
      PORT: 4004
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-nutriexpress}:${RABBITMQ_CLAVE:-nutriexpress}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      # Solo el orden de arranque: si RabbitMQ cae, el servicio sigue y se reconecta solo.
      rabbitmq:
        condition: service_started

  ms-pagos:
    build: ./servicios/ms-pagos
    environment:
      DATABASE_URL: postgresql://pagos:${PAGOS_CLAVE_BD:-pagos}@postgres:5432/pagos_db
      PORT: 4005
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-nutriexpress}:${RABBITMQ_CLAVE:-nutriexpress}@rabbitmq:5672
      # HU-27: el sistema nace en modo simulado. Para el modo real (Libélula), en .env:
      # LIBELULA_URL_BASE, LIBELULA_API_KEY, LIBELULA_EMAIL_COMERCIO y PAGO_URL_PUBLICA
      # (la dirección pública por la que Libélula avisa del pago).
      LIBELULA_URL_BASE: ${LIBELULA_URL_BASE:-}
      LIBELULA_API_KEY: ${LIBELULA_API_KEY:-}
      LIBELULA_EMAIL_COMERCIO: ${LIBELULA_EMAIL_COMERCIO:-}
      PAGO_URL_PUBLICA: ${PAGO_URL_PUBLICA:-}
      PAGO_SECRETO_AVISOS: ${PAGO_SECRETO_AVISOS:-nutriexpress-desarrollo}
      PAGO_MINUTOS_EXPIRACION: ${PAGO_MINUTOS_EXPIRACION:-15}
    depends_on:
      postgres:
        condition: service_healthy
      # Solo el orden de arranque: si RabbitMQ cae, el servicio sigue y se reconecta solo.
      rabbitmq:
        condition: service_started

  ms-reportes:
    build: ./servicios/ms-reportes
    environment:
      MONGO_URL: mongodb://mongo:27017/reportes
      PORT: 4007
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-nutriexpress}:${RABBITMQ_CLAVE:-nutriexpress}@rabbitmq:5672
      # Correo saliente. Sin SMTP_HOST (en .env), los correos no se envían: se ven
      # en `docker compose logs ms-reportes` (por ejemplo, el código de recuperación).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-NutriExpress <no-responder@nutriexpress.bo>}
    depends_on:
      - mongo
      # Solo el orden de arranque: si RabbitMQ cae, el servicio sigue y se reconecta solo.
      - rabbitmq

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ms-identidad
      - ms-catalogo
      - ms-inventario
      - ms-pedidos
      - ms-pagos
      - ms-reportes

volumes:
  datos-postgres:
  datos-mongo:
  datos-redis:
  claves-jwt:
